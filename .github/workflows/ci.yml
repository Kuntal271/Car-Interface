name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  vehicle-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :vehicle:test :vehicle:detektMain --no-daemon
  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Quality gates run in "check with baseline" mode: existing findings are frozen in config/detekt/baseline-*.xml and
      # config/lint/lint-baseline-app.xml, so only NEW findings fail. Regenerate with tools/rebaseline.sh (never to hide a regression).
      - name: Static analysis (detekt incl. Compose rules, type-resolved) and Android lint
        run: ./gradlew :app:detektDebug :vehicle:detektMain :app:lintDebug :app:lintRelease --no-daemon
      - name: Unit tests with coverage (Android SDK is preinstalled on the runner; ANDROID_HOME is set)
        run: ./gradlew :app:testDebugUnitTest :vehicle:test :vehicle:jacocoTestReport :app:createDebugUnitTestCoverageReport -Pcoverage --no-daemon
      - name: Coverage summary
        run: python3 tools/coverage-summary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Debug and release (R8) builds
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.sarif
            app/build/reports/detekt/
            vehicle/build/reports/detekt/
            app/build/reports/coverage/
            vehicle/build/reports/jacoco/
            app/build/reports/tests/
            vehicle/build/reports/tests/
          retention-days: 14
  python-and-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest test_canbox_decode
        working-directory: tools
      - run: python3 tools/design-check.py
