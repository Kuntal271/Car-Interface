name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  vehicle-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :vehicle:test --no-daemon
  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build (Android SDK is preinstalled on the runner; ANDROID_HOME is set)
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  python-and-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest test_canbox_decode
        working-directory: tools
      - run: python3 tools/design-check.py
