<!doctype html>
<html lang="en" class="doc"><head><meta charset="utf-8"><title>Prototype · Cockpit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="assets/ui.css"><link rel="stylesheet" href="assets/site.css"><script src="assets/ui.js"></script><script src="assets/screens.js"></script>
<style>
html.doc,html.doc body{overflow:hidden;height:100%}
body.proto{display:grid;grid-template-columns:300px 1fr;grid-template-rows:56px 1fr;height:100vh;background:#02030a}
.top{grid-column:1/3;display:flex;align-items:center;gap:22px;padding:0 20px;border-bottom:1px solid var(--hair);background:rgba(5,7,13,.96)}
.top .brand{display:flex;align-items:center;gap:10px;font:800 26px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.top .brand i{width:12px;height:12px;background:var(--lime);transform:rotate(45deg);display:block}
.top a.l{font:700 17px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)} .top a.l:hover{color:var(--text)}
.top .sp{flex:1} .top .hint{font:500 14px var(--f-mono);color:var(--dim)}
.side{overflow:auto;border-right:1px solid var(--hair);background:var(--s1);padding:14px 12px 30px}
.side h4{font:600 13px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:18px 6px 8px}
.side .it{display:flex;align-items:center;gap:10px;padding:9px 10px;font:600 17px var(--f-ui);color:#c9d3f0;cursor:pointer;border-left:3px solid transparent}
.side .it:hover{background:var(--c12)} .side .it.on{background:linear-gradient(90deg,var(--l12),transparent);border-left-color:var(--lime);color:var(--text)}
.side .it small{margin-left:auto;font:500 12px var(--f-mono);color:var(--dim)}
.sc-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 4px}
.sc-row button{font:700 15px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:var(--c25);border:0;box-shadow:inset 0 0 0 1px var(--hair);padding:9px 12px;cursor:pointer}
.sc-row button.on{background:var(--lime);color:var(--bg);box-shadow:none}
.stagebox{overflow:hidden;position:relative;background:radial-gradient(900px 600px at 50% 40%,rgba(36,87,255,.10),transparent 70%),#02030a}
.bezel{position:absolute;left:50%;top:50%;width:1344px;height:864px;margin:-432px 0 0 -672px;padding:32px;background:linear-gradient(145deg,#141a2e,#070a14);border-radius:46px;
  box-shadow:0 0 0 2px #1d2646,0 0 0 3px #05070d,0 40px 100px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);transform-origin:center center}
.bezel iframe{width:1280px;height:800px;border:0;display:block;background:#05070D}
.bezel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:46px;margin-top:-23px;background:#222c52;border-radius:3px}
.bezel::before{content:"";position:absolute;left:11px;top:50%;width:6px;height:46px;margin-top:-23px;background:#222c52;border-radius:3px}
html[data-theme="ford"] .sc-row button{border-radius:999px;text-transform:none;font-size:16px;letter-spacing:.01em;box-shadow:inset 0 0 0 1px var(--hair)}
html[data-theme="ford"] .sc-row button.on{background:var(--accent);color:var(--on-accent)}
html[data-theme="ford"] .side .it{border-radius:12px;border-left:0;font-size:18px}
html[data-theme="ford"] .side .it.on{background:rgba(43,114,255,.22);box-shadow:inset 0 0 0 1px rgba(var(--cobalt-lt-rgb),.4)}
html[data-theme="ford"] .side h4{text-transform:none;letter-spacing:.04em;font-size:15px}
html[data-theme="ford"] .top a.l{text-transform:none;font-family:var(--f-ui);font-weight:600;letter-spacing:.01em;font-size:17px}
</style></head>
<body class="doc proto">
<div class="top"><span class="brand"><i></i>Cockpit prototype</span><a class="l" href="index.html">Overview</a><a class="l" href="design-system.html">Design system</a><a class="l" href="specs.html">Specs</a><span class="sp"></span><span class="hint">1–9 jump · [ ] prev/next · L live · S scenario</span></div>
<aside class="side" id="side"></aside>
<main class="stagebox" id="box"><div class="bezel" id="bezel"><iframe id="fr" title="Head unit"></iframe></div></main>
<script>
var fr = document.getElementById('fr'), bez = document.getElementById('bezel'), box = document.getElementById('box');
var state = { id: 'home', live: true, t: 25.6 };
var SC = [['Parked', 92], ['Launch', 2], ['Pulling', 25.6], ['Cruise', 50], ['Braking', 64]];
var KEYS = ['home', 'drive', 'car', 'media', 'phone', 'projection', 'apps', 'settings', 'trips'];
function src() { return 'screens/' + state.id + '.html?embed=1&theme=' + UI.theme + (state.live ? '&live=1' : '') + '&t=' + state.t; }
function go(id) { state.id = id; fr.src = src(); mark(); }
function mark() {
  document.querySelectorAll('.it').forEach(function (e) { e.classList.toggle('on', e.dataset.id === state.id); });
  document.querySelectorAll('[data-l]').forEach(function (b) { b.classList.toggle('on', (b.dataset.l === '1') === state.live); });
  document.querySelectorAll('[data-t]').forEach(function (b) { b.classList.toggle('on', parseFloat(b.dataset.t) === state.t); });
}
function build() {
  var h = '<h4>Simulation</h4><div class="sc-row"><button data-l="1">Live</button><button data-l="0">Still</button></div><h4>Scenario</h4><div class="sc-row">' +
    SC.map(function (s) { return '<button data-t="' + s[1] + '">' + s[0] + '</button>'; }).join('') + '</div>';
  GROUPS.forEach(function (g) {
    h += '<h4>' + g + '</h4>';
    SCREENS.forEach(function (s) { if (s.g === g) { var k = KEYS.indexOf(s.id); h += '<div class="it" data-id="' + s.id + '">' + s.t + (k >= 0 ? '<small>' + (k + 1) + '</small>' : '') + '</div>'; } });
  });
  document.getElementById('side').innerHTML = h;
  document.querySelectorAll('.it').forEach(function (e) { e.onclick = function () { go(e.dataset.id); }; });
  document.querySelectorAll('[data-l]').forEach(function (b) { b.onclick = function () { state.live = b.dataset.l === '1'; go(state.id); }; });
  document.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { state.t = parseFloat(b.dataset.t); state.live = true; go(state.id); }; });
}
function fit() { var k = Math.min((box.clientWidth - 24) / 1344, (box.clientHeight - 24) / 864, 1.25); bez.style.transform = 'scale(' + k + ')'; }
fr.addEventListener('load', function () {
  try { var m = fr.contentWindow.location.pathname.match(/screens\/([^/.]+)\.html/); if (m) { state.id = m[1]; mark(); history.replaceState(null, '', '#' + state.id); } } catch (e) {}
});
addEventListener('resize', fit);
addEventListener('keydown', function (e) {
  var ids = SCREENS.map(function (s) { return s.id; }), i = ids.indexOf(state.id);
  if (e.key >= '1' && e.key <= '9') go(KEYS[+e.key - 1]);
  else if (e.key === ']') go(ids[(i + 1) % ids.length]);
  else if (e.key === '[') go(ids[(i - 1 + ids.length) % ids.length]);
  else if (e.key.toLowerCase() === 'l') { state.live = !state.live; go(state.id); }
  else if (e.key.toLowerCase() === 's') { var j = SC.findIndex(function (s) { return s[1] === state.t; }); state.t = SC[(j + 1) % SC.length][1]; state.live = true; go(state.id); }
});
build(); fit();
var hs = location.hash.slice(1); if (hs && SCREENS.some(function (s) { return s.id === hs; })) state.id = hs;
go(state.id);
</script></body></html>
