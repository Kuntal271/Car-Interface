<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Drive · Boost · Cockpit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../assets/ui.css"><script src="../assets/ui.js"></script>
<style>
.tile{display:flex;flex-direction:column;justify-content:space-between;height:132px}
.tile .v{font:800 60px/.9 var(--f-display)}
.run{display:flex;justify-content:space-between;align-items:center;height:44px;border-bottom:1px solid var(--hair-soft);font:500 20px var(--f-ui)}
.run b{font:800 30px var(--f-display)}
</style></head>
<body><div class="stage"><div class="frame" data-active="drive">
<main class="main row g24" data-od-id="drive-boost">
  <section class="col g12" style="width:660px">
    <div class="row jb c" style="height:44px">
      <div class="tabs"><a href="drive.html" class="chip">Cluster</a><a class="chip on">Boost</a><a href="drive-cruise.html" class="chip">Cruise</a></div>
      <span class="badge">Source · OBD MAP − BARO</span>
    </div>
    <div class="card col" style="height:372px;padding:10px 14px" data-od-id="boost-arc">
      <svg id="arc" viewBox="0 0 640 350" width="632" height="348"></svg>
    </div>
    <div class="card col" style="height:248px" data-od-id="spool-chart">
      <div class="row jb c"><span class="lbl">Last 25 seconds</span><span class="row g16 c mono"><span class="lime">■ boost</span><span style="color:var(--cobalt)">■ rpm</span></span></div>
      <svg id="chart" viewBox="0 0 616 170" width="616" height="170" style="margin-top:10px"></svg>
    </div>
  </section>

  <section class="col g12 grow">
    <div class="row g12">
      <div class="card tile grow" data-od-id="throttle"><span class="lbl">Throttle</span><div class="v"><span id="thr">78</span><span class="unit">%</span></div><div id="thrbar" class="seg sk" data-n="16" data-v=".78" data-split=".85" style="height:14px"></div></div>
      <div class="card tile grow" data-od-id="load"><span class="lbl">Engine load</span><div class="v"><span id="load">88</span><span class="unit">%</span></div><div id="loadbar" class="seg sk" data-n="16" data-v=".88" data-split=".85" style="height:14px"></div></div>
    </div>
    <div class="row g12">
      <div class="card tile grow" data-od-id="map"><span class="lbl">Manifold abs.</span><div class="v"><span id="map">195</span><span class="unit">kPa</span></div><span class="mono">baro 100 kPa</span></div>
      <div class="card tile grow" data-od-id="iat"><span class="lbl">Intake air</span><div class="v"><span id="iat">44</span><span class="unit">°C</span></div><span class="mono">ambient 31 °C</span></div>
    </div>
    <div class="card col grow" data-od-id="timer">
      <div class="row jb c"><span class="lbl row c g8"><i data-i="flag" data-s="22"></i>0–100 km/h</span><span class="badge fill">Armed</span></div>
      <div class="row" style="align-items:baseline;gap:10px;margin:8px 0 8px"><span class="num lime" style="font-size:92px">0.0</span><span class="unit">s</span><span class="grow"></span><span class="lbl">Best <b class="white">12.3</b></span></div>
      <div class="run"><span class="dim">Run 3 · today</span><b>12.8</b></div>
      <div class="run"><span class="dim">Run 2 · today</span><b>12.5</b></div>
      <div class="run" style="border:0"><span class="dim">Run 1 · yesterday</span><b class="lime">12.3</b></div>
    </div>
  </section>
</main>
</div></div>
<script>
UI.onready = function () {
  var $ = function (i) { return document.getElementById(i); };
  /* semicircle bipolar boost gauge: -1.0 .. +1.5 bar over 200deg */
  var peak = 1.04;
  function arc(b) {
    var cx = 320, cy = 292, r1 = 226, r2 = 278, a0 = -100, a1 = 100, n = 50, step = (a1 - a0) / n, zero = .4, v = (b + 1) / 2.5, s = '';
    for (var i = 0; i < n; i++) {
      var f = (i + .5) / n, lit = v >= zero ? (f >= zero && f <= v) : (f <= zero && f >= v);
      var fill = lit ? (f >= zero ? 'var(--lime)' : 'var(--cobalt)') : 'rgba(var(--cobalt-rgb),.24)';
      s += '<path d="' + UI.sector(cx, cy, r1, r2, a0 + i * step + .6, a0 + (i + 1) * step - .6) + '" fill="' + fill + '"/>';
    }
    [[-1, '−1.0'], [-.5, '−0.5'], [0, '0'], [.5, '+0.5'], [1, '+1.0'], [1.5, '+1.5']].forEach(function (t) {
      var a = a0 + ((t[0] + 1) / 2.5) * (a1 - a0), p1 = UI.pol(cx, cy, r1 - 10, a), p2 = UI.pol(cx, cy, r1 - 26, a), tp = UI.pol(cx, cy, r1 - 52, a);
      s += '<line x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '" stroke="' + (t[0] > 0 ? 'var(--lime)' : 'var(--cobalt-lt)') + '" stroke-width="3"/>' +
        '<text x="' + tp[0] + '" y="' + (tp[1] + 8) + '" text-anchor="middle" font-family="var(--f-ui)" font-weight="600" font-size="21" fill="var(--dim)">' + t[1] + '</text>';
    });
    var pa = a0 + ((peak + 1) / 2.5) * (a1 - a0), q = [UI.pol(cx, cy, r2 + 4, pa), UI.pol(cx, cy, r2 + 24, pa - 2.2), UI.pol(cx, cy, r2 + 24, pa + 2.2)];
    s += '<polygon points="' + q.join(' ') + '" fill="var(--lime)"/>';
    s += '<text x="' + cx + '" y="' + (cy - 14) + '" text-anchor="middle" font-family="var(--f-display)" font-weight="800" font-size="118" fill="' + (b >= 0 ? 'var(--lime)' : 'var(--cobalt-lt)') + '">' + (b >= 0 ? '+' : '−') + Math.abs(b).toFixed(2) + '</text>';
    s += '<text x="' + cx + '" y="' + (cy + 34) + '" text-anchor="middle" font-family="var(--f-ui)" font-weight="600" font-size="24" letter-spacing="4" fill="var(--dim)">bar · gauge</text>';
    $('arc').innerHTML = s;
  }
  function chart(t0) {
    var W = 616, H = 170, s = '', pb = [], pr = [];
    for (var i = 0; i <= 50; i++) { var d = UI.Sim.at(Math.max(0, t0 - 25 + i * .5)); pb.push((i / 50 * W).toFixed(1) + ',' + (H - ((d.boost + 1) / 2.5) * H).toFixed(1)); pr.push((i / 50 * W).toFixed(1) + ',' + (H - (d.rpm / 7000) * H).toFixed(1)); }
    for (var g = 0; g <= 4; g++) s += '<line x1="0" x2="' + W + '" y1="' + (g * H / 4) + '" y2="' + (g * H / 4) + '" stroke="rgba(var(--cobalt-rgb),.22)"/>';
    s += '<line x1="0" x2="' + W + '" y1="' + (H - .4 * H) + '" y2="' + (H - .4 * H) + '" stroke="var(--cobalt-lt)" stroke-dasharray="6 6"/>';
    s += '<polyline points="' + pr.join(' ') + '" fill="none" stroke="var(--cobalt)" stroke-width="2.5"/><polyline points="' + pb.join(' ') + '" fill="none" stroke="var(--lime)" stroke-width="3"/>';
    $('chart').innerHTML = s;
  }
  UI.live(function (s) {
    peak = Math.max(peak, s.boost); arc(s.boost); chart(s.t);
    $('thr').textContent = Math.round(s.throttle); UI.setSeg($('thrbar'), s.throttle / 100);
    $('load').textContent = Math.round(s.load); UI.setSeg($('loadbar'), s.load / 100);
    $('map').textContent = Math.round(s.map); $('iat').textContent = Math.round(s.iat);
  });
};
</script></body></html>
