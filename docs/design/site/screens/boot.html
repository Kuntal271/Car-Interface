<!doctype html>

  <div class="seg sk" data-n="48" data-v=".62" data-c="l" style="width:560px;height:12px;margin-top:40px"></div>

</div>
<div class="abs mono" style="left:28px;bottom:22px">v0.1 · design preview</div>
<div class="abs mono" style="right:28px;bottom:22px">Midnight · Cobalt · Lime</div>
